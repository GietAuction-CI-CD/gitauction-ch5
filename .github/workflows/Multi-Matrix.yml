name: Multi-Matrix
on: 
  workflow_dispatch:
    inputs:
      level:
        type: choice
        options:
          - info
          - warn
jobs:
  print:
     strategy:
       matrix:
        os: [ubuntu-latest, macos-latest]
        version: [18, 20]
     runs-on: ${{ matrix.os }}
     steps:
       - uses: actions/setup-node@v4
         with: 
            node-version: ${{ matrix.version }}
       - run: echo "${RUNNER_OS}" && node --version
        