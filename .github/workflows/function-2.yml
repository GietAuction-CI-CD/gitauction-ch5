name: function-2
on: push
jobs:
  function-2:
       runs-on: ubuntu-latest
       steps:
        - run: printenv | grep '_FUNC'
          env:
            FORMAT_FUNC: ${{ format('{0}, {1}.', 'Hi','world') }} # 형식 지정
            JOIN_FUNC: ${{ join(github.event.*.html_url, ', ') }} # 쉼표로 결합