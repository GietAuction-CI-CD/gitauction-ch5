name: function-2
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
  function-2:
       runs-on: ubuntu-latest
       steps:
        - run: printenv | grep '_FUNC'
          env:
            FORMAT_FUNC: ${{ format('{0}, {1}.', 'Hi','world') }} # 형식 지정 -> 결과 : Hi, world.
            JOIN_FUNC: ${{ join(github.event.*.html_url, ', ') }} # 쉼표로 결합