name: Debuglog  # 워크 플로우 명
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
  log: #job-id
    runs-on: ubuntu-latest
    steps:
      - run: echo "::debug::This is a debug log" #디버깅 로그를 설정한 경우에만 출력