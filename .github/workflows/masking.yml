name: Add mask
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
  masking:
    runs-on: ubuntu-latest
    env:
      PASSWORD: 1234
    steps:
     - run: echo "${PASSWORD}"
     - run: echo "::add-mask::${PASSWORD}"