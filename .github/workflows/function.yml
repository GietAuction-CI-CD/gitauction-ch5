name: function
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
    functionJob:
        runs-on: ubuntu-latest
        steps:
          - run: printenv | grep '_FUNC'
            env:
              CONTAINS: ${{ contains('Hello', 'ell') }}           # 'ell'을 포함하는가
              STARTS_WITH_FUNC: ${{ startsWith('Hello', 'He') }}  # 'He'로 시작하는가
              ENDS_WITH_FUNC: ${{ endsWith('Hello', 'lo') }}      # 'lo'로 끝나는가