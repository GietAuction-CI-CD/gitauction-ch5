name: MidleEnv
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
  print:
    runs-on: ubuntu-latest
    env:
      ACTOR: ${{ github.actor }} # 콘텍스트값을 환경변수에 저장
    steps:
      - run: echo "${ACTOR}"   # 환경변수를 경유해 콘텍스트의 속정 참조