name: Secrets
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
  print:
    runs-on: ubuntu-latest
    env:
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - run: echo "${PASSWORD}"                  #로그 출력이 마스킹 된다.
      - run: echo "${PASSWORD:0:1} ${PASSWORD#?}"  #로그 출력이 마스킹 되지 않는다.