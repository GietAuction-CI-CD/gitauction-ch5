name: Job Summaries
on: # 워크 플로우 이벤트 훅 
  workflow_dispatch:
    inputs:
      greeting:                    # 입력 파라미터명
       type: string                # 데이터형
       default: Hello              # 기보값
       required: true              #파라미터 필수여부
       description: A cheeful word #파라미터 개요
jobs:
  summaries:
    runs-on: ubuntu-latest
    steps:
      - run: |
         echo " ## Example Title :rocket:" >> "${GITHUB_STEP_SUMMARY}"
         echo "- fisresline" >> "${GITHUB_STEP_SUMMARY}"
         echo "- second line" >> "${GITHUB_STEP_SUMMARY}"